name: 爬取关税数据

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: '批量大小'
        required: false
        default: '100'
      delay:
        description: '批次间延迟(秒)'
        required: false
        default: '0.2'
      update_uk:
        description: '更新英国税率'
        required: false
        default: 'true'
      update_ni:
        description: '更新北爱尔兰税率'
        required: false
        default: 'true'

  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行爬虫
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUTF8: 1
        NUMEXPR_MAX_THREADS: 8
      run: |
        python -c "import asyncio, os; from scraper import BatchUpdateManager; update_uk = os.getenv('INPUT_UPDATE_UK', 'true') == 'true'; update_ni = os.getenv('INPUT_UPDATE_NI', 'true') == 'true'; errors_only = os.getenv('INPUT_ERRORS_ONLY', 'false') == 'true'; mgr = BatchUpdateManager(); print('开始爬取任务...'); print(f'更新英国: {update_uk}, 北爱尔兰: {update_ni}, 仅错误: {errors_only}'); asyncio.run(mgr.update_all_tariffs(update_uk=update_uk, update_ni=update_ni))"

    - name: 创建Release
      uses: softprops/action-gh-release@v1
      with:
        body: '关税数据更新'
        files: tariffs.db
        tag_name: tariff-v${{ github.run_number }}
        name: 关税数据 - ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
